<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="shell">
    <div class="side"><div class="logo">🔐</div><h2>Welcome back</h2><p>Sign in to continue to your dashboard. Your account details are securely fetched from the database.</p></div>
    <section class="form-wrap">
      <h1>Sign in</h1>
      <p class="sub">Enter your credentials to continue</p>
      <div id="alert" class="alert"></div>
      <form id="loginForm" novalidate>
        <div class="field" data-field="email">
          <label for="email">Email</label>
          <div class="input-box"><input type="email" id="email" placeholder="you@example.com" autocomplete="username"></div>
          <div class="error"></div>
        </div>
        <div class="field" data-field="password">
          <label for="password">Password</label>
          <div class="input-box">
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
            <button type="button" class="toggle" aria-label="Show password">👁️</button>
          </div>
          <div class="error"></div>
        </div>
        <button type="submit" id="submitBtn" class="btn">Sign In</button>
      </form>
      <p class="switch">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
